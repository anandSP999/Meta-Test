<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Meta Glasses Pro – Premium Photo Converter (iPhone Edition)</title>
<meta name="description" content="Meta Glasses Pro lets you prepare photos with high-resolution output, EXIF metadata and custom watermarking through client-side processing. iPhone optimized.">
<meta property="og:title" content="Meta Glasses Pro (iPhone)">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+Devanagari:wght@400;600&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/piexifjs/1.0.6/piexif.js"></script>
<style>
  :root {
    --bg: #0a0d16;
    --card-bg: rgba(18, 24, 38, 0.75);
    --card-border: rgba(255, 255, 255, 0.12);
    --accent: #3b82f6;
    --accent2: #8b5cf6;
    --accent3: #ec4899;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --ok: #10b981;
    --danger: #ef4444;
    --glass: rgba(15, 20, 32, 0.7);
    --glass-border: rgba(255, 255, 255, 0.15);
    --shadow: 0 10px 40px rgba(0,0,0,0.6);
    --gradient: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
    --font-main: 'Inter', 'Noto Sans Devanagari', sans-serif;
    --font-heading: 'Space Grotesk', 'Inter', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    font-family: var(--font-main);
    background: var(--bg);
    color: var(--text-main);
    overflow-x: hidden;
    line-height: 1.6;
    /* Safe area support for iPhone */
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* Background */
  .bg-animated { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at 20% 20%, rgba(59,130,246,0.15), transparent 40%), radial-gradient(circle at 80% 80%, rgba(236,72,153,0.15), transparent 40%), radial-gradient(circle at 50% 50%, rgba(139,92,246,0.1), transparent 60%), #0a0d16; }
  .bg-blobs { position: fixed; width: 100%; height: 100%; z-index: -2; filter: blur(80px); overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; opacity: 0.4; animation: float 12s infinite alternate ease-in-out; }
  .blob1 { width: 400px; height: 400px; background: #3b82f6; top: -10%; left: -10%; }
  .blob2 { width: 300px; height: 300px; background: #ec4899; bottom: -10%; right: -10%; animation-delay: 4s; }
  .blob3 { width: 200px; height: 200px; background: #8b5cf6; top: 40%; left: 60%; animation-delay: 8s; }
  @keyframes float { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(30px,-30px) scale(1.1); } }

  /* Preloader */
  #preloader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #070a12; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease; }
  #preloader.hidden { opacity: 0; pointer-events: none; }
  .preloader-glasses { font-size: 80px; animation: glassesPulse 2s infinite; }
  @keyframes glassesPulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } }
  .preloader-text { margin-top: 20px; font-family: var(--font-heading); font-weight: 700; font-size: 24px; letter-spacing: 2px; background: linear-gradient(90deg, #60a5fa, #8b5cf6, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: textFade 2s infinite; }
  @keyframes textFade { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

  /* Navigation */
  .nav { position: sticky; top: env(safe-area-inset-top); z-index: 1000; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); background: rgba(7, 10, 18, 0.85); border-bottom: 1px solid var(--glass-border); padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; }
  .nav-logo { font-family: var(--font-heading); font-weight: 800; font-size: 20px; color: #fff; display: flex; align-items: center; gap: 8px; }
  .nav-menu { display: flex; gap: 18px; align-items: center; }
  .nav-menu a { color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 600; transition: color 0.2s; }
  .nav-menu a:hover { color: #fff; }
  .nav-cta { background: var(--gradient); padding: 8px 16px; border-radius: 50px; color: #fff; font-weight: 800; text-decoration: none; font-size: 14px; box-shadow: 0 4px 15px rgba(59,130,246,0.4); }
  .nav-cta:active { transform: scale(0.95); }

  /* Ecosystem Top */
  .ecosystem-top { background: rgba(0,0,0,0.4); border-bottom: 1px solid var(--glass-border); padding: 20px 0; overflow: hidden; }
  .eco-heading { text-align: center; font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 10px; letter-spacing: 1px; }
  .eco-sub { text-align: center; font-size: 13px; color: var(--text-muted); margin-bottom: 14px; }
  .eco-scroll { display: flex; gap: 16px; overflow-x: auto; padding: 0 20px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .eco-scroll::-webkit-scrollbar { display: none; }
  .eco-card { min-width: 230px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 16px; padding: 16px; scroll-snap-align: center; backdrop-filter: blur(10px); transition: transform 0.3s; flex-shrink: 0; }
  .eco-card:active { transform: scale(0.97); }
  .eco-card h4 { font-size: 16px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .eco-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
  .eco-card a { display: inline-block; background: rgba(59,130,246,0.2); border: 1px solid rgba(59,130,246,0.4); color: #60a5fa; padding: 6px 16px; border-radius: 20px; text-decoration: none; font-size: 13px; font-weight: 700; }

  /* Share Btn */
  .share-site-btn { display: block; width: 90%; max-width: 400px; margin: 20px auto; background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); border-radius: 50px; padding: 14px; text-align: center; color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; backdrop-filter: blur(10px); transition: transform 0.2s; }
  .share-site-btn:active { transform: scale(0.96); }

  /* Hero */
  .hero { padding: 60px 20px 40px; text-align: center; position: relative; min-height: 70vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .hero-badge { display: inline-block; background: rgba(59,130,246,0.2); border: 1px solid rgba(59,130,246,0.5); padding: 6px 16px; border-radius: 99px; font-size: 12px; font-weight: 700; letter-spacing: 1px; margin-bottom: 20px; color: #60a5fa; }
  .hero h1 { font-family: var(--font-heading); font-size: 44px; line-height: 1.2; font-weight: 800; background: linear-gradient(135deg, #fff, #cbd5e1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 16px; }
  .hero p { color: var(--text-muted); font-size: 16px; max-width: 400px; margin: 0 auto 30px; }
  .hero-buttons { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .btn-primary { background: var(--gradient); border: none; padding: 16px 32px; border-radius: 50px; color: #fff; font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 8px 30px rgba(59,130,246,0.5); transition: transform 0.2s; }
  .btn-primary:active { transform: scale(0.96); }
  .btn-secondary { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); padding: 16px 32px; border-radius: 50px; color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; backdrop-filter: blur(10px); }
  .btn-secondary:active { transform: scale(0.96); }

  /* Converter */
  .converter-section { max-width: 480px; margin: 40px auto; padding: 0 20px; }
  .converter-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .converter-header h2 { font-family: var(--font-heading); font-size: 24px; font-weight: 800; }
  .status-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; }
  .status-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.4; } }

  .watermark-input-group { margin-bottom: 16px; }
  .watermark-label { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; display: block; }
  .watermark-input { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.3); color: #fff; font-size: 16px; font-family: var(--font-main); outline: none; }
  .watermark-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.2); }

  .upload-area { border: 2px dashed rgba(59,130,246,0.5); border-radius: 20px; padding: 40px 20px; text-align: center; background: rgba(11,17,33,0.5); cursor: pointer; transition: all 0.3s ease; margin-bottom: 16px; }
  .upload-area:hover { border-color: #60a5fa; background: rgba(59,130,246,0.05); transform: scale(0.99); }
  .upload-icon { font-size: 60px; margin-bottom: 16px; animation: floatIcon 3s ease-in-out infinite; }
  @keyframes floatIcon { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .upload-title { font-size: 18px; font-weight: 700; }
  .upload-sub { color: var(--text-muted); font-size: 14px; }

  .preview-container { display: none; position: relative; border-radius: 20px; overflow: hidden; background: #000; border: 1px solid var(--glass-border); margin-bottom: 16px; }
  .preview-container.visible { display: block; animation: fadeInScale 0.4s ease; }
  @keyframes fadeInScale { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  .preview-img { width: 100%; max-height: 350px; object-fit: contain; display: block; }
  .preview-tag { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); color: #60a5fa; padding: 4px 10px; border-radius: 99px; font-size: 12px; backdrop-filter: blur(5px); }
  .preview-info { padding: 10px; background: rgba(0,0,0,0.5); display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; }
  .preview-info span { display: inline-flex; align-items: center; gap: 4px; color: #e2e8f0; }

  .convert-btn { width: 100%; background: var(--gradient); border: none; padding: 18px; border-radius: 16px; color: #fff; font-size: 18px; font-weight: 800; cursor: pointer; box-shadow: 0 8px 30px rgba(59,130,246,0.4); position: relative; overflow: hidden; transition: transform 0.15s; margin-bottom: 16px; }
  .convert-btn:active { transform: scale(0.97); }
  .convert-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: left 0.5s; }
  .convert-btn:hover::before { left: 100%; }

  .sub-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .btn-secondary-small { background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); border-radius: 12px; padding: 14px; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; transition: background 0.2s; }
  .btn-secondary-small:active { background: rgba(255,255,255,0.2); }

  /* Toast */
  .toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: rgba(20,24,40,0.95); border: 1px solid var(--glass-border); color: #fff; padding: 14px 24px; border-radius: 50px; font-size: 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.4); backdrop-filter: blur(10px); z-index: 10000; opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }

  /* Features, How, Privacy, Creator, Ecosystem, Footer (same as before but compact) */
  .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin: 40px 20px; }
  .feature-card { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 20px; padding: 24px; text-align: center; transition: transform 0.3s; backdrop-filter: blur(10px); }
  .feature-card:hover { transform: translateY(-5px); }
  .feature-icon { font-size: 40px; margin-bottom: 12px; }
  .feature-title { font-weight: 800; font-size: 18px; margin-bottom: 8px; }
  .feature-desc { font-size: 14px; color: var(--text-muted); }

  .timeline { max-width: 600px; margin: 40px auto; padding: 0 20px; }
  .timeline-step { position: relative; padding-left: 50px; padding-bottom: 30px; }
  .timeline-step::before { content: ''; position: absolute; left: 25px; top: 0; bottom: 0; width: 2px; background: linear-gradient(180deg, var(--accent), transparent); }
  .timeline-step:last-child::before { display: none; }
  .timeline-num { position: absolute; left: 10px; top: 0; width: 30px; height: 30px; border-radius: 50%; background: var(--gradient); color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .timeline-step h4 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .timeline-step p { font-size: 14px; color: var(--text-muted); }

  .privacy-section { text-align: center; padding: 50px 20px; background: rgba(0,0,0,0.3); border-top: 1px solid var(--glass-border); border-bottom: 1px solid var(--glass-border); }
  .privacy-shield { font-size: 60px; animation: shieldPulse 2s infinite; }
  @keyframes shieldPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  .privacy-section h2 { font-family: var(--font-heading); font-size: 28px; margin-bottom: 10px; }
  .privacy-section p { color: var(--text-muted); max-width: 400px; margin: 0 auto; }
  .privacy-badges { display: flex; justify-content: center; gap: 20px; margin-top: 30px; flex-wrap: wrap; }
  .privacy-badge { background: rgba(255,255,255,0.1); border-radius: 30px; padding: 6px 16px; font-size: 13px; font-weight: 700; letter-spacing: 1px; }

  .creator-section { text-align: center; padding: 30px 20px; background: rgba(255,255,255,0.03); border-top: 1px solid var(--glass-border); }
  .creator-section h3 { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
  .creator-section .creator-name { font-size: 18px; font-weight: 700; color: #60a5fa; margin-bottom: 10px; }
  .creator-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .btn-edit-name { background: rgba(59,130,246,0.2); border: 1px solid rgba(59,130,246,0.4); color: #60a5fa; padding: 8px 18px; border-radius: 30px; font-weight: 700; cursor: pointer; }
  .btn-reset-name { background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); color: #e2e8f0; padding: 8px 18px; border-radius: 30px; font-weight: 700; cursor: pointer; }

  .ecosystem-detail { max-width: 800px; margin: 40px auto; padding: 20px; }
  .eco-detail-heading { text-align: center; font-size: 28px; font-weight: 800; margin-bottom: 20px; }
  .eco-detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
  .eco-detail-card { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; text-align: center; transition: transform 0.3s; }
  .eco-detail-card:hover { transform: translateY(-5px); }
  .eco-detail-card .icon { font-size: 40px; margin-bottom: 10px; }
  .eco-detail-card h4 { font-size: 18px; margin-bottom: 6px; }
  .eco-detail-card p { font-size: 14px; color: var(--text-muted); margin-bottom: 12px; }
  .eco-detail-card a { display: inline-block; background: var(--gradient); color: #fff; padding: 8px 20px; border-radius: 30px; text-decoration: none; font-weight: 700; font-size: 14px; }

  .footer { padding: 30px 20px; text-align: center; border-top: 1px solid var(--glass-border); background: rgba(0,0,0,0.4); }
  .footer .brand { font-family: var(--font-heading); font-size: 24px; font-weight: 800; margin-bottom: 8px; }
  .footer .tagline { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }
  .footer .creator { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .footer .insta-link { color: #60a5fa; text-decoration: none; font-weight: 700; }
  .footer-links { margin-top: 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }
  .footer-links a { color: var(--text-muted); text-decoration: none; font-size: 13px; }

  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 5000; backdrop-filter: blur(5px); }
  .modal-overlay.active { display: flex; }
  .modal-content { background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 24px; max-width: 350px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
  .modal-content h3 { font-size: 20px; font-weight: 800; margin-bottom: 16px; }
  .modal-content input { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.3); color: #fff; font-size: 16px; margin-bottom: 16px; outline: none; }
  .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; }
  .modal-buttons button { padding: 10px 20px; border-radius: 30px; font-weight: 700; border: none; cursor: pointer; }
  .modal-save { background: var(--gradient); color: #fff; }
  .modal-cancel { background: rgba(255,255,255,0.1); color: #fff; }

  @media (max-width: 480px) { .hero h1 { font-size: 36px; } .nav-menu { display: none; } .features-grid { grid-template-columns: 1fr 1fr; } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; } }
</style>
</head>

<div class="bg-animated"></div>

<!-- Preloader -->

<!-- Navigation -->
<nav class="nav">
  <div class="nav-logo">🕶️ META GLASSES PRO</div>
  <div class="nav-menu"><a href="#converter">Converter</a><a href="#features">Features</a><a href="#privacy">Privacy</a></div>

<!-- Ecosystem Top -->
<section class="ecosystem-top">
  <div class="eco-heading">🌟 E
